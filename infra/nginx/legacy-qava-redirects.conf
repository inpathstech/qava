# Permanent redirects from legacy qava.ai hosts → theclubnyc.com
# Enable AFTER new hosts are verified (Stage 4).

# Marketing (if apex/www still hit this nginx — otherwise use GoDaddy forwarding
# or CloudFront Function for qava.ai → www.theclubnyc.com)
server {
    listen 80;
    listen 443 ssl http2;
    server_name qava.ai www.qava.ai;

    # ssl_certificate … (keep existing qava.ai cert)

    return 301 https://www.theclubnyc.com$request_uri;
}

# App
server {
    listen 80;
    listen 443 ssl http2;
    server_name app.qava.ai;

    # ssl_certificate … (keep existing app.qava.ai cert)

    return 301 https://app.theclubnyc.com$request_uri;
}

# API — HTML admin → app; API paths → new API host
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.qava.ai;

    # ssl_certificate … (keep existing api.qava.ai cert)

    location /admin {
        return 301 https://app.theclubnyc.com$request_uri;
    }

    location /api/ {
        return 301 https://api.theclubnyc.com$request_uri;
    }

    location / {
        return 301 https://api.theclubnyc.com$request_uri;
    }
}
