# App host: Next.js + proxied admin UI (Nest).
# Install: /etc/nginx/sites-available/app.theclubnyc.com.conf → enable + reload
# TLS: use certbot or an ACM cert covering app.theclubnyc.com

upstream qava_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream qava_nest {
    server 127.0.0.1:3007;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.theclubnyc.com app.qava.ai;

    # After certbot, prefer the HTTPS server block and redirect here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.theclubnyc.com;

    # ssl_certificate /etc/letsencrypt/live/app.theclubnyc.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.theclubnyc.com/privkey.pem;

    client_max_body_size 25m;

    # Admin HTML + admin JSON API → Nest (same paths Nest already serves)
    location /admin {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://qava_nest;
    }

    location /api/admin {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://qava_nest;
    }

    # Everything else → Next.js standalone
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://qava_next;
    }
}
