<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How It Works</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      width: 100%;
      background: #fff;
    }

    html:not(.qava-hiw-embed-mode),
    body:not(.qava-hiw-embed-mode) {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    html.qava-hiw-embed-mode,
    body.qava-hiw-embed-mode {
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    body:not(.qava-hiw-embed-mode) #preview {
      height: auto;
      min-height: 0;
      overflow: hidden;
    }

    body.qava-hiw-embed-mode #preview {
      height: 100%;
    }

    body.qava-hiw-embed-mode #qava-hiw-shell-footer {
      display: none !important;
    }

    /* Dotted background on the shell so the footer reads as a contained
       white box over dots, matching every other qava.ai page. */
    #qava-hiw-shell-dots {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle, rgba(17, 24, 39, 0.16) 1px, transparent 1.35px);
      background-size: 20px 20px;
      background-repeat: repeat;
    }

    body.qava-hiw-embed-mode #qava-hiw-shell-dots {
      display: none !important;
    }

    body:not(.qava-hiw-embed-mode) > *:not(#qava-hiw-shell-dots) {
      position: relative;
      z-index: 1;
    }

    /* Footer styling comes entirely from qava-footer.js (applyQavaFooter),
       the exact same source as the qava.ai landing page, so the two stay
       identical. Only shell-specific concerns (dots, embed hiding, layering)
       are handled above. */
  </style>
  <link rel="stylesheet" href="/qava-auth.css" />
</head>
<body>
  <div id="qava-hiw-shell-dots" aria-hidden="true"></div>
  <iframe id="preview" src="/howqavaworks.html" title="Qava how-it-works preview"></iframe>
  <footer class="footer-section" id="qava-hiw-shell-footer"></footer>

  <script src="/qava-footer.js"></script>
  <script>
    (function () {
      const preview = document.getElementById("preview");
      const DISPLAY_FONT = '"Libre Caslon Display", "Canela", "Canela Deck", "Iowan Old Style", "Baskerville", "Times New Roman", serif';
      // When embedded inside SANDBOXindex (?embed=1), hide this page's own
      // navbar/footer so the host sandbox chrome is the only chrome shown.
      const IS_EMBED = new URLSearchParams(location.search).has("embed");
      if (IS_EMBED) {
        document.documentElement.classList.add("qava-hiw-embed-mode");
        document.body.classList.add("qava-hiw-embed-mode");
      } else if (typeof window.applyQavaFooter === "function") {
        window.applyQavaFooter(document);
      }
      const standaloneStyles = `
        html,
        body {
          height: auto !important;
          min-height: 100% !important;
          overflow-x: hidden !important;
          overflow-y: auto !important;
        }

        #preview {
          height: auto !important;
          min-height: 0 !important;
          overflow: hidden !important;
        }

        .hero-section {
          padding-top: 100px !important;
          padding-bottom: 24px !important;
        }

        .client-how-it-works-page {
          min-height: auto !important;
        }

        .footer-section {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
        }
      `;
      const embedStyles = `
        html,
        body {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
        }

        #preview {
          height: auto !important;
          min-height: 0 !important;
        }

        .header-container,
        .mobile-menu,
        .footer-section {
          display: none !important;
        }

        .hero-section {
          padding-top: 32px !important;
          padding-bottom: 16px !important;
        }
      `;

      const injectedStyles = `
        /* ---------- Base ---------- */
        body {
          position: relative;
          background: #ffffff !important;
        }

        #qava-dot-base-fixed {
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: 0;
          background-image: radial-gradient(circle, rgba(17, 24, 39, 0.16) 1px, transparent 1.35px);
          background-size: 20px 20px;
          background-repeat: repeat;
        }

        body > *:not(#qava-dot-base-fixed):not(.header-container) {
          position: relative;
          z-index: 1;
        }

        .client-how-it-works-page,
        .hero-section,
        .info-section-wrapper,
        .info-section,
        .questionnaire-section {
          background: transparent !important;
        }

        .client-how-it-works-page {
          min-height: auto !important;
          padding-bottom: 80px !important;
        }

        footer.footer-section,
        .footer-section {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          border: 0 !important;
        }

        /* ---------- Navbar (ported from SANDBOXindex) ---------- */
        .header-container {
          width: calc(100% - 22px) !important;
          margin: 0 auto !important;
          padding: 8px 20px !important;
          border-radius: 0 !important;
          position: sticky !important;
          top: 0 !important;
          z-index: 1200 !important;
          background: rgba(255, 255, 255, 0.24) !important;
          -webkit-backdrop-filter: blur(18px) saturate(150%) !important;
          backdrop-filter: blur(18px) saturate(150%) !important;
          border: 0 !important;
          box-shadow: none !important;
          isolation: isolate !important;
        }

        .header-container::before {
          content: "" !important;
          position: absolute !important;
          left: 6px !important;
          right: 6px !important;
          top: 3px !important;
          bottom: 3px !important;
          border-radius: 12px !important;
          background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.62) 0%,
            rgba(255, 255, 255, 0.5) 55%,
            rgba(255, 255, 255, 0.44) 100%
          ) !important;
          -webkit-backdrop-filter: blur(26px) saturate(165%) !important;
          backdrop-filter: blur(26px) saturate(165%) !important;
          border: 0 !important;
          box-shadow:
            0 10px 24px rgba(17, 24, 39, 0.08),
            inset 0 1px 0 rgba(255, 255, 255, 0.7) !important;
          z-index: 0 !important;
          pointer-events: none !important;
        }

        .header-container > * {
          position: relative !important;
          z-index: 1 !important;
        }

        .header-container .logo {
          background: transparent !important;
          padding: 0 !important;
          border-radius: 0 !important;
          border: none !important;
          box-shadow: none !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
        }

        .header-container .logo img,
        .qava-nav-logo-face {
          width: 72px !important;
          height: 16px !important;
          display: block !important;
          border-radius: 4px !important;
          box-shadow: none !important;
          border: none !important;
        }

        .qava-nav-logo-flip { width: 72px; height: 16px; perspective: 700px;
    overflow: visible;}

        .qava-nav-logo-inner {
          width: 100%;
          height: 100%;
          position: relative;
          transform-style: preserve-3d;
          transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .qava-nav-logo-inner.is-flipped{
          transform: rotateX(180deg);
        }

        .qava-nav-logo-face {
          position: absolute;
          inset: 0;
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
        }

        .qava-nav-logo-front { object-fit: contain !important; border-radius: 4px; }

        .qava-nav-logo-back{
          object-fit: contain !important;
          transform: rotateX(180deg);
        }

        .header-container .nav-item,
        .header-container .auth-item {
          background: transparent !important;
          border: 0 !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
          transition: color 0.2s ease !important;
        }

        .header-container .navigation .nav-item .nav-text,
        .header-container .auth-item .nav-text {
          font-family: "Inter", sans-serif !important;
          font-size: 14px !important;
          font-weight: 300 !important;
          color: #6b6b6b !important;
          line-height: 1.4 !important;
        }

        .header-container .nav-item:hover,
        .header-container .auth-item:hover {
          background: transparent !important;
          border: 0 !important;
          box-shadow: none !important;
        }

        .header-container .nav-item:hover .nav-text,
        .header-container .auth-item:hover .nav-text,
        .header-container .nav-item.active .nav-text,
        .header-container .auth-item.active .nav-text {
          color: #000000 !important;
          background: none !important;
          box-shadow: none !important;
          text-decoration: none !important;
        }

        .join-button {
          background: #2b2b2b !important;
          border-color: #2b2b2b !important;
          color: #ffffff !important;
          transform: none !important;
          transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease !important;
          box-shadow: none !important;
        }

        .join-button .join-text {
          color: #ffffff !important;
        }

        .join-button:hover {
          background: #000000 !important;
          border-color: #000000 !important;
          box-shadow: none !important;
          transform: none !important;
        }

        .header-container .auth-section {
          gap: 28px !important;
        }

        /* ---------- Hero ---------- */
        .hero-section {
          padding-top: 100px !important;
          padding-bottom: 16px !important;
        }

        .path-selection-wrapper {
          margin-top: 24px !important;
          margin-bottom: 56px !important;
          gap: 0 !important;
          min-height: 0 !important;
          height: auto !important;
          align-items: center !important;
          transition: none !important;
        }

        .path-columns-wrapper {
          display: none !important;
        }

        .questionnaire-section {
          display: none !important;
          height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .qava-hiw-hero-icon {
          width: 124px !important;
          height: 124px !important;
          border-radius: 28px !important;
          object-fit: cover !important;
          display: block !important;
          margin: 0 auto 26px auto !important;
          box-shadow: 0 16px 50px rgba(20, 10, 22, 0.18) !important;
          transform-style: preserve-3d;
          backface-visibility: hidden;
          will-change: transform;
          animation: qavaHiwHeroFlip 2.4s linear infinite;
        }

        @keyframes qavaHiwHeroFlip {
          0% { transform: perspective(900px) rotateY(-22deg) rotateZ(-1deg); }
          25% { transform: perspective(900px) rotateY(0deg) rotateZ(0deg); }
          50% { transform: perspective(900px) rotateY(22deg) rotateZ(1deg); }
          75% { transform: perspective(900px) rotateY(0deg) rotateZ(0deg); }
          100% { transform: perspective(900px) rotateY(-22deg) rotateZ(-1deg); }
        }

        .hero-title {
          font-family: ${DISPLAY_FONT} !important;
          font-weight: 400 !important;
          font-size: clamp(34px, 3.6vw, 52px) !important;
          line-height: 1.08 !important;
          letter-spacing: -0.012em !important;
          color: #111827 !important;
          margin-bottom: 12px !important;
        }

        .hero-highlight,
        .path-section-title .highlight {
          background: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          color: inherit !important;
        }

        .hero-subtext {
          display: block !important;
          margin-top: 4px !important;
        }

        .hero-subtext.qava-hiw-hero-sub-hidden {
          display: none !important;
        }

        .hero-subtext p {
          font-family: "Inter", sans-serif !important;
          font-size: 16px !important;
          font-weight: 300 !important;
          color: #6B6B6B !important;
          line-height: 1.6 !important;
        }

        .hero-subtext strong {
          font-weight: 500 !important;
          color: #111827 !important;
        }

        /* ---------- Progress bar ---------- */
        .progress-bar {
          display: none !important;
        }

        .progress-fill {
          background: #111827 !important;
        }

        /* ---------- Path selection ---------- */
        /* The original two-column path grid is replaced by the 3 audience choices below. */
        .path-columns-wrapper {
          display: none !important;
        }

        .path-section-column {
          background: #f4f4f5 !important;
          border-radius: 14px !important;
          padding: 26px 26px 30px 26px !important;
          box-sizing: border-box !important;
        }

        .qava-hiw-choices {
          width: min(900px, calc(100% - 48px));
          margin: 0 auto;
          display: flex;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: stretch;
          gap: 16px;
        }

        .qava-hiw-choice {
          flex: 1 1 220px;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          position: relative;
          text-align: left;
          background: #ffffff;
          border: 1px solid transparent;
          border-radius: 12px;
          padding: 14px 16px 16px 16px;
          cursor: pointer;
          box-shadow: 0 1px 3px rgba(17, 24, 39, 0.06);
          transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
          font-family: "Inter", sans-serif;
        }

        .qava-hiw-choice:hover {
          background: #f4f4f5;
        }

        .qava-hiw-choice.selected {
          background: #ffffff;
          border-color: #111827;
        }

        .qava-hiw-choice-emoji {
          flex: 0 0 auto;
          width: 38px;
          height: 38px;
          font-size: 22px;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          background: transparent;
          border-radius: 10px;
        }

        .qava-hiw-choice-body {
          display: flex;
          flex-direction: column;
          gap: 3px;
          flex: 1 1 auto;
          min-width: 0;
        }

        .qava-hiw-choice-title {
          font-size: 16px;
          font-weight: 600;
          color: #111827;
          letter-spacing: -0.005em;
        }

        .qava-hiw-choice-desc {
          font-size: 13.5px;
          font-weight: 300;
          color: #6b6b6b;
          line-height: 1.4;
        }

        .qava-hiw-choice-check {
          position: absolute;
          top: 12px;
          right: 12px;
          flex: 0 0 auto;
          width: 20px;
          height: 20px;
          border-radius: 6px;
          border: 1px solid #d1d5db;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: background 0.15s ease, border-color 0.15s ease;
        }

        .qava-hiw-choice-check svg {
          opacity: 0;
          transition: opacity 0.15s ease;
        }

        .qava-hiw-choice.selected .qava-hiw-choice-check {
          background: #111827;
          border-color: #111827;
        }

        .qava-hiw-choice.selected .qava-hiw-choice-check svg {
          opacity: 1;
        }

        /* ---------- Audience flow (question step) ---------- */
        .qava-hiw-flow {
          display: none;
          width: min(1100px, calc(100% - 48px));
          margin: 40px auto 56px auto;
          font-family: "Inter", sans-serif;
        }

        .qava-hiw-flow.active {
          display: block;
        }

        .qava-hiw-q-title {
          font-family: ${DISPLAY_FONT};
          font-weight: 400;
          font-size: 26px;
          letter-spacing: -0.012em;
          color: #111827;
          text-align: center;
          margin: 0 0 4px 0;
        }

        .qava-hiw-q-sub {
          font-size: 14px;
          font-weight: 300;
          color: #6b6b6b;
          text-align: center;
          margin: 0 0 22px 0;
        }

        .qava-hiw-panel {
          display: flex;
          gap: 22px;
          align-items: stretch;
        }

        .qava-hiw-menu {
          position: relative;
          flex: 0 0 210px;
          align-self: start;
          display: flex;
          flex-direction: column;
          gap: 2px;
          background: #ffffff;
          border: 1px solid rgba(17, 24, 39, 0.06);
          border-radius: 12px;
          box-shadow: 0 1px 6px rgba(15, 23, 42, 0.06);
          padding: 10px;
        }

        .qava-hiw-menu-indicator {
          position: absolute;
          left: 10px;
          top: 0;
          width: 2px;
          height: 0;
          background: #111827;
          border-radius: 1px;
          transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .qava-hiw-menu-item {
          position: relative;
          display: flex;
          align-items: center;
          text-align: left;
          background: transparent;
          border: none;
          border-radius: 0;
          padding: 6px 0 6px 14px;
          cursor: pointer;
          box-shadow: none;
          transition: color 0.15s ease, font-weight 0.15s ease;
          font-family: "Inter", sans-serif;
          width: 100%;
        }

        .qava-hiw-menu-item:hover {
          background: transparent;
        }

        .qava-hiw-menu-item.active {
          background: transparent;
        }

        .qava-hiw-menu-label {
          font-size: 14px;
          font-weight: 300;
          color: #6b6b6b;
          white-space: nowrap;
        }

        .qava-hiw-menu-item:hover .qava-hiw-menu-label {
          color: #111827;
        }

        .qava-hiw-menu-item.active .qava-hiw-menu-label {
          font-weight: 500;
          color: #111827;
        }

        .qava-hiw-content {
          flex: 1 1 auto;
          min-width: 0;
          background: #ffffff;
          border-radius: 12px;
          box-shadow: 0 1px 3px rgba(17, 24, 39, 0.06);
          padding: 26px 28px;
          text-align: left;
        }

        .qava-hiw-content-title {
          font-family: ${DISPLAY_FONT};
          font-weight: 400;
          font-size: 22px;
          letter-spacing: -0.012em;
          color: #111827;
          margin: 0 0 10px 0;
        }

        .qava-hiw-content-emoji {
          font-family: "Inter", sans-serif;
          font-size: 20px;
          line-height: 1;
          margin-left: 6px;
        }

        .qava-hiw-content-text {
          font-size: 14.5px;
          font-weight: 300;
          color: #4b5563;
          line-height: 1.6;
          margin: 0 0 16px 0;
        }

        .qava-hiw-content-list {
          list-style: none;
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          gap: 9px;
        }

        .qava-hiw-content-list li {
          position: relative;
          padding-left: 22px;
          font-size: 14px;
          font-weight: 300;
          color: #374151;
          line-height: 1.5;
        }

        .qava-hiw-content-list li::before {
          content: "";
          position: absolute;
          left: 4px;
          top: 8px;
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #111827;
        }

        @media (max-width: 680px) {
          .qava-hiw-panel {
            flex-direction: column;
          }
          .qava-hiw-menu {
            flex: 1 1 auto;
            flex-direction: row;
            flex-wrap: wrap;
          }
          .qava-hiw-menu-item {
            width: auto;
            flex: 1 1 140px;
          }
        }

        .qava-hiw-q-nav {
          display: flex;
          justify-content: flex-end;
          align-items: center;
          gap: 14px;
          margin-top: 26px;
        }

        .qava-hiw-back {
          background: none;
          border: none;
          color: #6b6b6b;
          font-family: "Inter", sans-serif;
          font-size: 14px;
          font-weight: 300;
          cursor: pointer;
          padding: 8px 4px;
        }

        .qava-hiw-back:hover {
          color: #111827;
        }

        .qava-hiw-join {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          background: #2b2b2b;
          color: #ffffff;
          border: none;
          border-radius: 6px;
          padding: 6px 12px;
          font-family: "Inter", sans-serif;
          font-size: 13px;
          font-weight: 400;
          line-height: 1.2;
          white-space: nowrap;
          cursor: pointer;
          text-decoration: none;
          transition: background 0.18s ease;
        }

        .qava-hiw-join:hover {
          background: #000000;
          color: #ffffff;
        }

        .qava-hiw-tellmore {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          background: #2b2b2b;
          color: #ffffff;
          border: none;
          border-radius: 6px;
          padding: 6px 12px;
          font-family: "Inter", sans-serif;
          font-size: 13px;
          font-weight: 400;
          line-height: 1.2;
          white-space: nowrap;
          cursor: pointer;
          transition: background 0.18s ease;
        }

        .qava-hiw-tellmore:hover {
          background: #000000;
        }

        .qava-hiw-more {
          background: #111111;
          border-radius: 12px;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
          padding: 26px 28px;
          margin-top: 16px;
          text-align: left;
        }

        .qava-hiw-more[hidden] {
          display: none;
        }

        .qava-hiw-more-text {
          font-family: "Inter", sans-serif;
          font-size: 15px;
          font-weight: 300;
          color: #ffffff;
          line-height: 1.7;
          margin: 0;
        }

        .qava-hiw-more-list {
          margin: 12px 0;
          padding-left: 20px;
          list-style: disc;
        }

        .qava-hiw-more-list li {
          font-size: 15px;
          font-weight: 400;
          color: #ffffff;
          line-height: 1.7;
        }

        .qava-hiw-more-nav {
          display: flex;
          justify-content: flex-start;
          margin-top: 20px;
        }

        .qava-hiw-more .qava-hiw-join {
          background: #ffffff;
          color: #111111;
        }

        .qava-hiw-more .qava-hiw-join:hover {
          background: #f0f0f0;
          color: #111111;
        }

        .qava-hiw-continue {
          background: #2b2b2b;
          color: #ffffff;
          border: none;
          border-radius: 6px;
          padding: 10px 24px;
          font-family: "Inter", sans-serif;
          font-size: 14px;
          font-weight: 500;
          cursor: pointer;
          transition: background 0.18s ease;
        }

        .qava-hiw-continue:hover {
          background: #000000;
        }

        .qava-hiw-continue:disabled {
          background: #cfcfd3;
          cursor: not-allowed;
        }

        .path-section-title {
          font-family: ${DISPLAY_FONT} !important;
          font-weight: 400 !important;

                    para: "A great team needs more than great people — it needs coordination. Qava gives your cross-functional team a shared workspace to collaborate, share progress, and stay aligned.",
                    bullets: [
                      "Keep every team member aligned on goals and progress",
                      "Collaborate across roles without endless status meetings",
                      "Share context so each person builds on the others' work",
                      "Run parallel workstreams without losing the thread"
                    ]
                  },
                  {
                    emoji: "✅",
                    label: "Ship real results",
                    heading: "Walk away with real output",
                    para: "Your master team isn't a thought exercise — it's built to deliver. Qava helps you scope, staff, and run the work so you end up with finished deliverables, not just good conversations.",
                    bullets: [
                      "End with finished deliverables your whole team contributed to",
                      "Get rigorous work you can use — not just slide decks",
                      "See how a cross-functional team performs before you hire",
                      "Turn one great project into a model for how you work"
                    ]
                  }
                ]
              }
            };
            const checkSvg = '<svg width="12" height="10" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            const choices = frameDoc.createElement("div");
            choices.id = "qava-hiw-choices";
            choices.className = "qava-hiw-choices";
            choices.setAttribute("role", "radiogroup");
            choices.innerHTML = choiceData.map((d) => `
              <button type="button" class="qava-hiw-choice" role="radio" aria-checked="false">
                <span class="qava-hiw-choice-emoji">${d.emoji}</span>
                <span class="qava-hiw-choice-body">
                  <span class="qava-hiw-choice-title">${d.title}</span>
                  <span class="qava-hiw-choice-desc">${d.desc}</span>
                </span>
                <span class="qava-hiw-choice-check" aria-hidden="true">${checkSvg}</span>
              </button>
            `).join("");
            pathSelectionWrapper.insertBefore(choices, pathSelectionWrapper.firstChild);

            // Flow container holds the question step shown after a choice is picked.
            const flow = frameDoc.createElement("div");
            flow.id = "qava-hiw-flow";
            flow.className = "qava-hiw-flow";
            pathSelectionWrapper.insertBefore(flow, choices.nextSibling);

            const showChoices = () => {
              flow.classList.remove("active");
              choices.style.display = "";
              updateHero(defaultHero.title, defaultHero.sub);
              window.__qavaHiwScheduleHeight?.();
            };

            const renderFlow = (key) => {
              const f = flowData[key];
              if (!f) return;
              flow.innerHTML = `
                <div class="qava-hiw-panel">
                  <div class="qava-hiw-menu" role="tablist">
                    <span class="qava-hiw-menu-indicator" id="qava-hiw-menu-indicator"></span>
                    ${f.items.map((o, i) => `
                      <button type="button" class="qava-hiw-menu-item" role="tab" data-i="${i}" aria-selected="false">
                        <span class="qava-hiw-menu-label">${o.label}</span>
                      </button>
                    `).join("")}
                  </div>
                  <div class="qava-hiw-content" role="tabpanel"></div>
                </div>
                <div class="qava-hiw-q-nav">
                  <button type="button" class="qava-hiw-tellmore">Tell me more</button>
                </div>
                <div class="qava-hiw-more" hidden>
                  <div class="qava-hiw-more-text">${f.tellMore}</div>
                  <div class="qava-hiw-more-nav">
                    <a href="https://app.qava.ai/" class="qava-hiw-join">Join for free</a>
                  </div>
                </div>
              `;

              const content = flow.querySelector(".qava-hiw-content");
              const menu = flow.querySelector(".qava-hiw-menu");
              const menuIndicator = flow.querySelector("#qava-hiw-menu-indicator");
              const items = flow.querySelectorAll(".qava-hiw-menu-item");
              const moveIndicator = (btn) => {
                if (!menuIndicator || !btn) return;
                menuIndicator.style.height = btn.offsetHeight + "px";
                menuIndicator.style.transform = "translateY(" + btn.offsetTop + "px)";
              };
              const renderContent = (i) => {
                const o = f.items[i];
                const list = o.bullets
                  ? `<ul class="qava-hiw-content-list">${o.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`
                  : "";
                content.innerHTML = `
                  <h3 class="qava-hiw-content-title">${o.heading}<span class="qava-hiw-content-emoji">${o.emoji}</span></h3>
                  <p class="qava-hiw-content-text">${o.para}</p>
                  ${list}
                `;
              };
              const selectItem = (i) => {
                items.forEach((x) => { x.classList.remove("active"); x.setAttribute("aria-selected", "false"); });
                items[i].classList.add("active");
                items[i].setAttribute("aria-selected", "true");
                renderContent(i);
                requestAnimationFrame(() => moveIndicator(items[i]));
              };
              items.forEach((it, i) => it.addEventListener("click", () => selectItem(i)));
              selectItem(0);
              setTimeout(() => moveIndicator(items[0]), 50);

              const tellMoreBtn = flow.querySelector(".qava-hiw-tellmore");
              const moreBox = flow.querySelector(".qava-hiw-more");
              if (tellMoreBtn && moreBox) {
                tellMoreBtn.addEventListener("click", () => {
                  moreBox.hidden = false;
                  tellMoreBtn.style.display = "none";
                  window.__qavaHiwScheduleHeight?.();
                });
              }

              window.__qavaHiwScheduleHeight?.();
            };

            choices.querySelectorAll(".qava-hiw-choice").forEach((btn, idx) => {
              btn.addEventListener("click", () => {
                choices.querySelectorAll(".qava-hiw-choice").forEach((b) => {
                  b.classList.remove("selected");
                  b.setAttribute("aria-checked", "false");
                });
                btn.classList.add("selected");
                btn.setAttribute("aria-checked", "true");

                const flowKey = choiceData[idx] && choiceData[idx].flow;
                if (flowKey && flowData[flowKey]) {
                  renderFlow(flowKey);
                  flow.classList.add("active");
                  window.__qavaHiwScheduleHeight?.();
                }
              });
            });
          }
        }

        const pathSelectionWrapper = frameDoc.querySelector(".path-selection-wrapper");
        if (pathSelectionWrapper && pathSelectionWrapper.getAttribute("data-qava-cleaned") !== "true") {
          pathSelectionWrapper.setAttribute("data-qava-cleaned", "true");
          pathSelectionWrapper.querySelectorAll(".path-columns-wrapper, .selected-button-container, .selected-description").forEach((el) => el.remove());
          const showMoreBtn = frameDoc.getElementById("showMoreButton");
          if (showMoreBtn && showMoreBtn.parentElement) {
            showMoreBtn.parentElement.remove();
          }
        }

        if (typeof window.applyQavaFooter === "function") {
          if (IS_EMBED) {
            window.applyQavaFooter(frameDoc);
          } else {
            frameDoc.querySelectorAll("footer.footer-section").forEach((footer) => footer.remove());
            window.applyQavaFooter(document);
          }
        }

        syncIframeHeight = () => {
          const main = frameDoc.querySelector(".client-how-it-works-page");
          if (!main) return;
          const height = Math.max(
            Math.ceil(main.scrollHeight),
            Math.ceil(main.getBoundingClientRect().bottom)
          ) + 8;
          if (height > 0) preview.style.height = height + "px";
          if (IS_EMBED) {
            try {
              window.parent.postMessage({ type: "qava-hiw-resize", height }, "*");
            } catch (e) {}
          }
        };

        scheduleIframeHeight = () => {
          syncIframeHeight();
          requestAnimationFrame(syncIframeHeight);
          setTimeout(syncIframeHeight, 80);
          setTimeout(syncIframeHeight, 320);
        };

        window.__qavaHiwSyncHeight = syncIframeHeight;
        window.__qavaHiwScheduleHeight = scheduleIframeHeight;

        const mainEl = frameDoc.querySelector(".client-how-it-works-page");
        if (mainEl && !frameDoc.defaultView.__qavaHiwResizeObs) {
          frameDoc.defaultView.__qavaHiwResizeObs = new ResizeObserver(() => window.__qavaHiwScheduleHeight?.());
          frameDoc.defaultView.__qavaHiwResizeObs.observe(mainEl);
        }

        if (!frameDoc.defaultView.__qavaHiwMutationObs) {
          frameDoc.defaultView.__qavaHiwMutationObs = new MutationObserver(() => window.__qavaHiwScheduleHeight?.());
          frameDoc.defaultView.__qavaHiwMutationObs.observe(frameDoc.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"] });
        }

        window.__qavaHiwScheduleHeight?.();
        if (!frameDoc.defaultView.__qavaHiwResizeBound) {
          frameDoc.defaultView.__qavaHiwResizeBound = true;
          frameDoc.defaultView.addEventListener("resize", () => window.__qavaHiwScheduleHeight?.());
          window.addEventListener("resize", () => window.__qavaHiwScheduleHeight?.());
          setInterval(() => window.__qavaHiwScheduleHeight?.(), 500);
        }
      };

      preview.addEventListener("load", attachSandboxEnhancements);
      attachSandboxEnhancements();
    })();
  </script>
  <script src="/qava-auth.js"></script>
</body>
</html>
