      const NAV_RENAMES = [
        { match: "create listing", label: "Create listing" },
        { match: "search listings", label: "Find work" },
        { match: "about", label: "Newsletter" }
      ];

      const attachSandboxEnhancements = () => {
        const frameDoc = preview.contentDocument;
        if (!frameDoc || !frameDoc.head || !frameDoc.body) return;

        if (!frameDoc.getElementById("qava-sandbox-canela-link")) {
          const fontLink = frameDoc.createElement("link");
          fontLink.id = "qava-sandbox-canela-link";
          fontLink.rel = "stylesheet";
          fontLink.href = "https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap";
          frameDoc.head.appendChild(fontLink);
        }

        let styleTag = frameDoc.getElementById("qava-sandbox-style");
        if (!styleTag) {
          styleTag = frameDoc.createElement("style");
          styleTag.id = "qava-sandbox-style";
          frameDoc.head.appendChild(styleTag);
        }
        styleTag.textContent = injectedStyles;

        const pricingSubtitle = frameDoc.querySelector(".pricing-subtitle");
        if (pricingSubtitle) {
          pricingSubtitle.textContent = "No more complicated pricing tiers";
        }

        if (!frameDoc.getElementById("qava-dot-base-fixed")) {
          const fixedDotLayer = frameDoc.createElement("div");
          fixedDotLayer.id = "qava-dot-base-fixed";
          frameDoc.body.prepend(fixedDotLayer);
        }

        const logoLink = frameDoc.querySelector(".header-logo .logo a, .logo a");
        const logoImg = logoLink && logoLink.querySelector("img");
        if (logoLink && logoImg && !frameDoc.getElementById("qava-nav-logo-flip")) {
          const originalSrc = logoImg.getAttribute("src") || "qava-logo.svg";
          const flip = frameDoc.createElement("div");
          flip.id = "qava-nav-logo-flip";
          flip.className = "qava-nav-logo-flip";
          flip.innerHTML = `
            <div class="qava-nav-logo-inner" id="qava-nav-logo-inner">
              <img class="qava-nav-logo-face qava-nav-logo-front" src="/the-club-logo-light.png" alt="The Club">
              <img class="qava-nav-logo-face qava-nav-logo-back" src="/the-club-logo-light.png" alt="">
            </div>
          `;
          logoLink.href = "/SANDBOXindex.html";
          logoLink.innerHTML = "";
          logoLink.appendChild(flip);

          const inner = flip.querySelector(".qava-nav-logo-inner");
          const flipWin = frameDoc.defaultView;
          if (flipWin.__qavaNavLogoFlipTimer) clearInterval(flipWin.__qavaNavLogoFlipTimer);
          let flipped = false;
          flipWin.__qavaNavLogoFlipTimer = setInterval(() => {
            flipped = !flipped;
            inner.classList.toggle("is-flipped", flipped);
          }, 5000);
        }

        Array.from(frameDoc.querySelectorAll(".navigation .nav-item .nav-text, .navigation .nav-item")).forEach((el) => {
          const textNode = el.classList.contains("nav-text") ? el : el.querySelector(".nav-text");
          const target = textNode || el;
          const current = (target.textContent || "").trim().toLowerCase();
          const rename = NAV_RENAMES.find((r) => r.match === current);
          if (rename) target.textContent = rename.label;
        });

        const newsletterNav = Array.from(frameDoc.querySelectorAll(".navigation a.nav-item")).find((a) =>
          (a.textContent || "").trim().toLowerCase() === "newsletter"
        );
        if (newsletterNav) newsletterNav.href = "/SANDBOXindex.html";

        const pricingNav = Array.from(frameDoc.querySelectorAll(".navigation a.nav-item")).find((a) =>
          (a.textContent || "").trim().toLowerCase() === "pricing"
        );
        if (pricingNav) pricingNav.classList.add("active");

        const howItWorksNavText = Array.from(frameDoc.querySelectorAll(".auth-item .nav-text, .mobile-nav-item")).find((item) => {
          const t = (item.textContent || "").trim().toLowerCase();
          return t === "how qava works" || t === "how it works";
        });
        if (howItWorksNavText) {
          howItWorksNavText.textContent = "How it works";
          const hiwLink = howItWorksNavText.closest("a");
          if (hiwLink) hiwLink.href = "/SANDBOXhowqavaworks.html";
        }

        frameDoc.querySelectorAll(".testimonial-section").forEach((el) => el.remove());

        const pricingTabs = frameDoc.querySelector(".pricing-tabs");
        if (pricingTabs && !pricingTabs.getAttribute("data-qava-radio-tabs")) {
          pricingTabs.setAttribute("data-qava-radio-tabs", "true");
          pricingTabs.classList.add("qava-pricing-radios");
          pricingTabs.setAttribute("role", "radiogroup");
          pricingTabs.setAttribute("aria-label", "Pricing category");

          const activeBtn = pricingTabs.querySelector(".tab-button.active");
          const activeTab = activeBtn ? activeBtn.getAttribute("data-tab") : "projects";
          const tabs = [
            { id: "projects", label: "Projects" },
            { id: "jobs", label: "Jobs" },
            { id: "internships", label: "Internships" }
          ];

          pricingTabs.innerHTML = tabs.map((tab) => `
            <label class="qava-toggle-radio">
              <input type="radio" name="qava-pricing-tab" value="${tab.id}" data-tab="${tab.id}"${activeTab === tab.id ? " checked" : ""} />
              <span>${tab.label}</span>
            </label>
          `).join("");

          const showPricingTab = (tabType) => {
            frameDoc.querySelectorAll("[data-panel]").forEach((panel) => {
              panel.style.display = "none";
              panel.hidden = true;
            });
            const panel = frameDoc.querySelector(`[data-panel="${tabType}"]`);
            if (panel) {
              panel.style.display = "block";
              panel.hidden = false;
            }
          };

          pricingTabs.querySelectorAll("input[name='qava-pricing-tab']").forEach((radio) => {
            radio.addEventListener("change", () => {
              if (!radio.checked) return;
              showPricingTab(radio.getAttribute("data-tab"));
            });
          });

          const checked = pricingTabs.querySelector("input[name='qava-pricing-tab']:checked");
          if (checked) showPricingTab(checked.getAttribute("data-tab"));
        }

        if (!frameDoc.getElementById("qava-pricing-info-section")) {
          const pricingContent = frameDoc.querySelector(".pricing-content");
          if (pricingContent) {
            const wrapper = frameDoc.createElement("div");
            wrapper.id = "qava-pricing-info-section";
            wrapper.className = "info-section-wrapper qava-pricing-info-wrapper";
            wrapper.innerHTML = INFO_SECTION_HTML;
            pricingContent.appendChild(wrapper);
          }
        }

        if (typeof window.applySandboxFooter === "function") {
          window.applySandboxFooter(frameDoc);
        }
      };

      preview.addEventListener("load", attachSandboxEnhancements);
      attachSandboxEnhancements();
    })();
  </script>
</body>
</html>
