name: Deploy Qava Landing Page

on:
  push:
    branches: [ main ]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.png'
      - '*.jpg'
      - '*.svg'
      - '*.mp4'
      - 'How it works/**'
      - 'pricing/**'
      - 'premium/**'
      - 'Landing Page Trusted by/**'
      - 'Testimonial images/**'
      - 'Testimonial company logos/**'
      - 'Competitor Platform/**'
      - 'Emails/**'
      - 'Template images/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Deploy to S3
      run: |
        # Upload main page as index.html
        aws s3 cp index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        # Upload embed/helper HTML pages used by the landing experience
        aws s3 cp newsletter.html s3://${{ secrets.S3_BUCKET_NAME }}/newsletter.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp therisegroup.html s3://${{ secrets.S3_BUCKET_NAME }}/therisegroup.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp liquidskateboard.html s3://${{ secrets.S3_BUCKET_NAME }}/liquidskateboard.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp noonesark.html s3://${{ secrets.S3_BUCKET_NAME }}/noonesark.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp mmento.html s3://${{ secrets.S3_BUCKET_NAME }}/mmento.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp attentioncapital.html s3://${{ secrets.S3_BUCKET_NAME }}/attentioncapital.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp lumi.html s3://${{ secrets.S3_BUCKET_NAME }}/lumi.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp roam.html s3://${{ secrets.S3_BUCKET_NAME }}/roam.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp aiphilosophy.html s3://${{ secrets.S3_BUCKET_NAME }}/aiphilosophy.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp templates.html s3://${{ secrets.S3_BUCKET_NAME }}/templates.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp termsofuse.html s3://${{ secrets.S3_BUCKET_NAME }}/termsofuse.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp useragreement.html s3://${{ secrets.S3_BUCKET_NAME }}/useragreement.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 sync howitworks/ s3://${{ secrets.S3_BUCKET_NAME }}/howitworks/ \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp howitworks.html s3://${{ secrets.S3_BUCKET_NAME }}/howitworks.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp howqavaworks.html s3://${{ secrets.S3_BUCKET_NAME }}/howqavaworks.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp pricing.html s3://${{ secrets.S3_BUCKET_NAME }}/pricing.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp pricing-content.html s3://${{ secrets.S3_BUCKET_NAME }}/pricing-content.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 sync pricing/ s3://${{ secrets.S3_BUCKET_NAME }}/pricing/ \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 sync premium/ s3://${{ secrets.S3_BUCKET_NAME }}/premium/ \
          --content-type "text/html" \
          --cache-control "max-age=3600"

        aws s3 cp hiw-embed.html s3://${{ secrets.S3_BUCKET_NAME }}/hiw-embed.html \
          --content-type "text/html" \
          --cache-control "max-age=3600"
          
        # Upload all assets
        aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/ \
          --exclude "*.html" \
          --exclude "*.md" \
          --exclude "*.sh" \
          --exclude "*.jsx" \
          --exclude "*.ts" \
          --exclude "*.tsx" \
          --exclude "node_modules/*" \
          --exclude ".git/*" \
          --exclude "Paths-Backend/*" \
          --exclude "Paths-Web-FE/*" \
          --exclude ".github/*"
          
    - name: Invalidate CloudFront
      if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
          
    - name: Deploy complete
      run: |
        echo "✅ Qava landing page deployed successfully!"
        echo "🌐 Your site is live at: https://qava.ai"
