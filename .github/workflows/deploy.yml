name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1
        
    - name: Deploy to S3
      run: |
        # Copy main landing page as index.html
        aws s3 cp index.html s3://qava-ai-bucket/index.html --cache-control "max-age=0,no-cache,no-store,must-revalidate"
        
        # Sync all other files
        aws s3 sync . s3://qava-ai-bucket/ --exclude ".git/*" --exclude ".github/*" --exclude "*.md" --exclude "*.sh" --exclude "*.json" --cache-control "max-age=31536000"
        
        # Sync HTML files with no-cache
        aws s3 sync . s3://qava-ai-bucket/ --exclude "complete-page.html" --include "*.html" --cache-control "max-age=0,no-cache,no-store,must-revalidate"
        
    - name: Invalidate CloudFront
      if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
          
    - name: Deploy complete
      run: echo "Website deployed successfully to qava.ai!"
