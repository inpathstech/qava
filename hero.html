<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Club</title>
    <link rel="icon" type="image/png" href="favicon.png"
    <link rel="apple-touch-icon" href="apple-touch-icon.png" /> />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }

        /* Hero Section - Notion Style */
        .hero-section {
            background: white;
            padding: 80px 0;
        }

        .hero-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 32px;
            text-align: center;
        }

        .hero-title {
            font-family: 'Inter', sans-serif;
            font-size: 80px;
            font-weight: 700;
            color: #000000;
            line-height: 100px;
            margin: 0 0 24px 0;
            letter-spacing: -2%;
        }

        .hero-title .blue-text {
            color: #0F62FE;
        }

        .hero-divider {
            width: 120px;
            height: 1px;
            background-color: rgba(0, 0, 0, 0.2);
            margin: 0 auto 24px auto;
        }

        .hero-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: rgba(0, 0, 0, 0.7);
            line-height: 1.5;
            margin: 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-section {
                padding: 60px 0;
            }

            .hero-container {
                padding: 0 16px;
            }

            .hero-title {
                font-size: 32px;
                line-height: 40px;
                margin-bottom: 16px;
            }

            .hero-subtitle {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 28px;
                line-height: 36px;
            }

            .hero-subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="hero-section">
        <div class="hero-container">
            <h1 class="hero-title">
                Strategy never<br>
                felt <span class="blue-text">so good.</span>
            </h1>
            <div class="hero-divider"></div>
            <p class="hero-subtitle">Work that matters by top tier MBAs</p>
        </div>
    </div>
</body>
</html>
